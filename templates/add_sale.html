<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Record Sale - InventoryIQ</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Record Sale</h1>
            <p class="text-muted">Create a new sales transaction</p>
        </div>

        <a href="/sales" class="btn btn-secondary">
            ← Back to Sales
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <form method="POST" action="/sales/add">

                <!-- Customer -->
                <div class="mb-4">
                    <label class="form-label">Customer</label>

                    <select
                        name="customer_id"
                        class="form-select"
                    >
                        <option value="">Walk-in Customer</option>

                        {% for customer in customers %}
                            <option value="{{ customer.id }}">
                                {{ customer.name }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

                <!-- Product -->
                <div class="mb-4">
                    <label class="form-label">Product</label>

                    <select
                        name="product_id"
                        id="product"
                        class="form-select"
                        required
                    >
                        <option value="">Select Product</option>

                        {% for product in products %}
                            <option
                                value="{{ product.id }}"
                                data-price="{{ product.selling_price }}"
                                data-stock="{{ product.stock }}"
                            >
                                {{ product.name }}
                                — ₹{{ "%.2f"|format(product.selling_price or 0) }}
                                (Stock: {{ product.stock }})
                            </option>
                        {% endfor %}

                    </select>
                </div>

                <!-- Quantity -->
                <div class="mb-4">
                    <label class="form-label">Quantity</label>

                    <input
                        type="number"
                        name="quantity"
                        id="quantity"
                        class="form-control"
                        min="1"
                        value="1"
                        required
                    >
                </div>

                <!-- Total Preview -->
                <div class="alert alert-light border mb-4">

                    <strong>Total:</strong>

                    <span
                        id="total"
                        class="float-end fw-bold"
                    >
                        ₹0.00
                    </span>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary px-4"
                >
                    Save Sale
                </button>

                <a
                    href="/sales"
                    class="btn btn-outline-secondary ms-2"
                >
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>


<script>

const productSelect = document.getElementById("product");
const quantityInput = document.getElementById("quantity");
const totalDisplay = document.getElementById("total");


function calculateTotal() {

    const selectedOption =
        productSelect.options[productSelect.selectedIndex];

    const price =
        parseFloat(selectedOption.dataset.price || 0);

    const quantity =
        parseInt(quantityInput.value || 0);

    const total =
        price * quantity;

    totalDisplay.textContent =
        "₹" + total.toFixed(2);
}


productSelect.addEventListener(
    "change",
    calculateTotal
);

quantityInput.addEventListener(
    "input",
    calculateTotal
);

</script>

</body>
</html>
