
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Purchase - InventoryIQ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #F6F7F5;
            color: #161B22;
            font-family: 'Inter', sans-serif;
        }

        .page-container {
            max-width: 900px;
            margin: auto;
            padding: 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .title h1 {
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 38px;
            font-weight: 600;
        }

        .title p {
            margin-top: 7px;
            color: #7B8794;
            font-size: 14px;
        }

        .back-btn {
            text-decoration: none;
            background: white;
            color: #161B22;
            border: 1px solid #E1E5E1;
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #F1F3F1;
        }

        .form-panel {
            background: white;
            border: 1px solid #E3E6E2;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .form-panel h2 {
            margin: 0 0 25px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 21px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #68737D;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #DDE2DE;
            border-radius: 9px;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            background: #FAFBFA;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #1F6F5C;
            background: white;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            text-decoration: none;
            border: none;
            padding: 11px 20px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .cancel-btn {
            background: #F1F3F1;
            color: #161B22;
        }

        .save-btn {
            background: #1F6F5C;
            color: white;
        }

        .save-btn:hover {
            background: #185747;
        }

        .help-text {
            margin-top: 6px;
            color: #8A939C;
            font-size: 12px;
        }

        @media (max-width: 600px) {

            .page-container {
                padding: 18px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
                gap: 15px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>

<body>

<div class="page-container">

    <div class="header">

        <div class="title">

            <h1>Add Purchase</h1>

            <p>
                Add stock purchased for your inventory
            </p>

        </div>

        <a href="{{ url_for('purchases') }}"
           class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>
            Purchases

        </a>

    </div>


    <div class="form-panel">

        <h2>
            Purchase Information
        </h2>

        <form method="POST"
              action="{{ url_for('add_purchase') }}">

            <div class="form-group">

                <label for="product_id">
                    Product *
                </label>

                <select id="product_id"
                        name="product_id"
                        required>

                    <option value="">
                        Select Product
                    </option>

                    {% for product in products %}

                    <option value="{{ product.id }}">
                        {{ product.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="quantity">
                    Quantity *
                </label>

                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    placeholder="Enter quantity"
                    required>

                <div class="help-text">
                    Number of units added to stock.
                </div>

            </div>


            <div class="form-group">

                <label for="purchase_price">
                    Purchase Price per Unit *
                </label>

                <input
                    type="number"
                    id="purchase_price"
                    name="purchase_price"
                    min="0"
                    step="0.01"
                    placeholder="Enter purchase price"
                    required>

                <div class="help-text">
                    Cost paid for one unit.
                </div>

            </div>


            <div class="form-actions">

                <a href="{{ url_for('purchases') }}"
                   class="btn cancel-btn">

                    Cancel

                </a>

                <button
                    type="submit"
                    class="btn save-btn">

                    <i class="fa-solid fa-box"></i>
                    Add Purchase

                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
