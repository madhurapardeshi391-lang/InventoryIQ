<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings - InventoryIQ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #F5F7F8;
            color: #17202A;
            font-family: 'Inter', sans-serif;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 35px;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .title h1 {
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 600;
        }

        .title p {
            margin: 7px 0 0;
            color: #718096;
            font-size: 14px;
        }

        .back-btn {
            text-decoration: none;
            color: #17202A;
            background: white;
            border: 1px solid #E1E6EA;
            padding: 11px 17px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #F0F3F5;
        }

        /* CARD */

        .settings-card {
            background: white;
            border: 1px solid #E2E7EA;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .section-title {
            margin-bottom: 22px;
        }

        .section-title h2 {
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 21px;
        }

        .section-title p {
            margin: 6px 0 0;
            color: #7A8794;
            font-size: 13px;
        }

        /* FORM */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #34404B;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #DCE2E5;
            border-radius: 9px;
            background: #FAFBFB;
            color: #17202A;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #237A68;
            background: white;
            box-shadow: 0 0 0 3px rgba(35, 122, 104, 0.08);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        /* ALERT */

        .alert-box {
            margin-top: 22px;
            padding: 16px;
            background: #F5F8F7;
            border: 1px solid #DCE9E5;
            border-radius: 11px;
        }

        .alert-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #34404B;
            cursor: pointer;
        }

        .alert-label input {
            width: auto;
            accent-color: #237A68;
        }

        .alert-description {
            margin: 7px 0 0 28px;
            color: #7A8794;
            font-size: 12px;
        }

        /* BUTTONS */

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #ECEFF1;
        }

        .btn {
            padding: 11px 18px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .cancel-btn {
            background: white;
            color: #34404B;
            border: 1px solid #DCE2E5;
        }

        .cancel-btn:hover {
            background: #F5F7F8;
        }

        .save-btn {
            background: #237A68;
            color: white;
            border: 1px solid #237A68;
        }

        .save-btn:hover {
            background: #1C6556;
        }

        /* RESPONSIVE */

        @media (max-width: 700px) {

            .container {
                padding: 20px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
                gap: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="title">

            <h1>Settings</h1>

            <p>
                Manage your store information and inventory preferences.
            </p>

        </div>

        <a href="{{ url_for('dashboard') }}" class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

            Dashboard

        </a>

    </div>


    <!-- SETTINGS CARD -->

    <div class="settings-card">

        <div class="section-title">

            <h2>Store Settings</h2>

            <p>
                Update the basic information and inventory settings for your store.
            </p>

        </div>


        <form method="POST"
              action="{{ url_for('settings') }}">


            <div class="form-grid">


                <!-- STORE NAME -->

                <div class="form-group">

                    <label for="store_name">
                        Store Name
                    </label>

                    <input
                        type="text"
                        id="store_name"
                        name="store_name"
                        value="{{ settings.store_name or '' }}"
                        placeholder="Enter store name"
                        required>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        value="{{ settings.phone or '' }}"
                        placeholder="Enter phone number">

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ settings.email or '' }}"
                        placeholder="Enter email address">

                </div>


                <!-- CURRENCY -->

                <div class="form-group">

                    <label for="currency">
                        Currency
                    </label>

                    <select
                        id="currency"
                        name="currency">

                        <option value="₹"
                            {% if settings.currency == '₹' %}selected{% endif %}>
                            ₹ - Indian Rupee
                        </option>

                        <option value="$"
                            {% if settings.currency == '$' %}selected{% endif %}>
                            $ - US Dollar
                        </option>

                        <option value="€"
                            {% if settings.currency == '€' %}selected{% endif %}>
                            € - Euro
                        </option>

                        <option value="£"
                            {% if settings.currency == '£' %}selected{% endif %}>
                            £ - British Pound
                        </option>

                    </select>

                </div>


                <!-- ADDRESS -->

                <div class="form-group full-width">

                    <label for="address">
                        Store Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter store address">{{ settings.address or '' }}</textarea>

                </div>


                <!-- REORDER LEVEL -->

                <div class="form-group">

                    <label for="default_reorder_level">
                        Default Reorder Level
                    </label>

                    <input
                        type="number"
                        id="default_reorder_level"
                        name="default_reorder_level"
                        value="{{ settings.default_reorder_level }}"
                        min="0"
                        required>

                </div>

            </div>


            <!-- LOW STOCK ALERT -->

            <div class="alert-box">

                <label class="alert-label">

                    <input
                        type="checkbox"
                        name="low_stock_alert"
                        {% if settings.low_stock_alert %}checked{% endif %}>

                    Enable Low Stock Alerts

                </label>

                <div class="alert-description">

                    Get low-stock warnings when a product reaches or falls below
                    its reorder level.

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <a href="{{ url_for('dashboard') }}"
                   class="btn cancel-btn">

                    Cancel

                </a>

                <button
                    type="submit"
                    class="btn save-btn">

                    <i class="fa-solid fa-check"></i>

                    Save Settings

                </button>

            </div>


        </form>

    </div>

</div>

</body>
</html>
