
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}InventoryIQ{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <!-- Dark Navy Navbar CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/navbar.css') }}"
    >

    {% block extra_css %}
    {% endblock %}
</head>

<body>

    {% if session.get('user_id') %}
        {% include 'nav.html' %}
    {% endif %}

    <!-- Page Content -->
    {% block content %}
    {% endblock %}

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Main JavaScript -->
    <script
        src="{{ url_for('static', filename='js/app.js') }}">
    </script>

    {% block extra_js %}
    {% endblock %}

</body>
</html>
